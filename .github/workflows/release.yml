name: release

on:
  push:
    tags:
      # Full version tags only. 'v*' would also match the v0 alias that
      # major-alias force-pushes at the end of this very workflow, so every
      # release re-triggered itself: a redundant rebuild, a mutable :v0 image
      # tag on ghcr, and a failed run each time, since the second pass tripped
      # the tag-shape guard below. This is also the shape the 'release tags are
      # immutable' ruleset protects.
      - 'v*.*.*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-image:
    permissions:
      # Job-level permissions replace the workflow-level block rather than
      # extending it, so contents has to be repeated here — without it the
      # token gets contents: none and the checkout below 403s.
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true

      - name: Build docker image and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  major-alias:
    # Consumers write `uses: threatcl/drift-action@v0`, which resolves through
    # this tag — so it has to follow every release, and it must never point at
    # a release whose image failed to publish. Hence `needs`.
    needs: release-image
    permissions:
      # Read, deliberately: the ruleset guarding refs/tags/v0 lets only the
      # release app move the alias (GitHub refuses to put the Actions
      # identity itself on a bypass list), so the push below authenticates
      # with a token minted from that app — GITHUB_TOKEN needs no write.
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Mint a release-app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # The ancestry check below needs main's history, not just the
          # tagged commit. If someone later trims this back to a shallow
          # fetch, origin/main stops resolving and the check fails closed.
          fetch-depth: 0
          # Persist the app token as the push credential, not GITHUB_TOKEN.
          token: ${{ steps.app-token.outputs.token }}

      - name: Move the major alias to this release
        run: |
          set -euo pipefail
          # Backstop, not the primary defence: the trigger above no longer
          # matches an alias tag. This still refuses to run if that filter is
          # ever loosened, which is what stops a release from re-triggering
          # itself in a loop.
          major="${GITHUB_REF_NAME%%.*}"
          if [ "$major" = "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME is not a vX.Y.Z tag; refusing to move an alias"
            exit 1
          fi
          # A tag push can carry its own commit, so the tagged SHA is not
          # guaranteed to have appeared in any pull request. Never point the
          # alias consumers resolve at code that has not landed on main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from main; refusing to move $major onto it"
            exit 1
          fi
          git tag -f "$major" "$GITHUB_SHA"
          git push origin -f "refs/tags/$major"
