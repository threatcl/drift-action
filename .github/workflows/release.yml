name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-image:
    permissions:
      # Job-level permissions replace the workflow-level block rather than
      # extending it, so contents has to be repeated here — without it the
      # token gets contents: none and the checkout below 403s.
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true

      - name: Build docker image and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  major-alias:
    # Consumers write `uses: threatcl/drift-action@v0`, which resolves through
    # this tag — so it has to follow every release, and it must never point at
    # a release whose image failed to publish. Hence `needs`.
    needs: release-image
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Move the major alias to this release
        run: |
          set -euo pipefail
          major="${GITHUB_REF_NAME%%.*}"
          if [ "$major" = "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME is not a vX.Y.Z tag; refusing to move an alias"
            exit 1
          fi
          git tag -f "$major" "$GITHUB_SHA"
          git push origin -f "refs/tags/$major"
