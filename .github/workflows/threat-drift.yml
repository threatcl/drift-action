name: threat-drift

on:
  pull_request:

# One review in flight per PR. A push supersedes the run for the previous
# commit rather than racing it for the sticky comment.
concurrency:
  group: threat-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      # The checkout stays: the diff comes from the compare API, but context
      # stuffing reads whole files out of the workspace.
      - uses: actions/checkout@v7

      # Pinned to an immutable commit rather than the major alias. This job holds the
      # Anthropic key and a write-scoped token, and the major alias is
      # force-moved on every release, so pinning to it would swap a
      # PR-controlled engine for a tag-push-controlled one instead of a fixed
      # one. Dependabot bumps the SHA; the trailing comment is how it tracks
      # the version.
      #
      # From v0.1.1 the pinned action.yml names the image by digest, so the
      # runner pulls it instead of building the container — the v0.1.0 pin
      # spent 81s per run compiling before the review could start. The pin
      # necessarily trails by one release: the SHA of the release being cut
      # does not exist while it is being cut.
      - uses: threatcl/drift-action@4d888eb897484931e63f9a15076607e155a281b4 # v1.0.1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
