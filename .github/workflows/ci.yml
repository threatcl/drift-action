name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test ./...

      # Replay the recorded corpus reviews. Free and offline, and the only
      # check that speaks to finding quality rather than to whether the code
      # runs: a change that breaks how findings are produced fails here
      # instead of on someone's pull request. -v so a recording that no
      # longer matches the assembled prompt announces itself in the log.
      - name: corpus replay
        env:
          THREATCL_DRIFT_CORPUS: replay
        run: go test ./internal/corpus -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9

  action-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate action.yml
        run: pipx run check-jsonschema --builtin-schema vendor.github-actions action.yml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
