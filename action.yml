name: 'Threatcl Drift'
description: 'Threat model drift review for pull requests, powered by threatcl'
author: 'Christian @xntrik Frichot'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  config-path:
    description: 'Path to the drift config file'
    required: false
    default: '.threatcl-ci.hcl'
  anthropic-api-key:
    description: 'Anthropic API key used for inference. Omit to run deterministic checks only.'
    required: false
    default: ''
  openai-api-key:
    description: 'OpenAI API key, used when llm.provider is "openai". Omit to run deterministic checks only.'
    required: false
    default: ''
  github-token:
    description: 'Token used to read the PR diff and write the comment and check run'
    required: false
    default: ${{ github.token }}
  fail-mode:
    description: 'Override the config fail mode: never | on-action-required'
    required: false
    default: ''
  model:
    description: 'Override the LLM model from config'
    required: false
    default: ''
  dry-run:
    description: 'Render the review and log it without posting the comment or check run'
    required: false
    default: 'false'
outputs:
  findings-count:
    description: 'Total number of drift findings'
  action-required-count:
    description: 'Findings at the Action required tier'
  verdict:
    description: 'clean | findings | action-required | unassessed | skipped | error'
  report-path:
    description: 'Path to the rendered markdown report (written under RUNNER_TEMP)'
runs:
  using: 'docker'
  # The published image, so a consumer pulls in seconds rather than building
  # the container on every run.
  #
  # Pinned by digest rather than by tag: a ghcr tag is a mutable pointer that
  # anyone with packages: write can repoint silently, while a digest names one
  # immutable manifest the runner will accept nothing else for.
  #
  # This line is written by .github/workflows/release.yml, not by hand. The
  # release publishes the image first and commits the digest it got back, so
  # every release names the engine it just built. Editing it in a release PR
  # only conflicts with the commit the workflow pushes. On main between
  # releases it names the most recent release's image — see docs/RELEASING.md.
  image: 'docker://ghcr.io/threatcl/drift-action@sha256:fdcc4e32a52acb2fa97b6c9f7fd14268777735b6bfdad8f1017dd8a3d7b9fca7'
  env:
    # Both keys are forwarded unconditionally; the engine reads only the one
    # its configured provider names in api_key_env, and an unset input arrives
    # as an empty string, which counts as no key. Forwarding on the provider
    # would need the config file read before the container starts, which is
    # exactly backwards.
    ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
    OPENAI_API_KEY: ${{ inputs.openai-api-key }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
